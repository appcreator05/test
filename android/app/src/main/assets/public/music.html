    <span onclick="closeModal()" style="position:absolute; top:calc(15px + env(safe-area-inset-top, 0px)); right:18px; font-size:22px; cursor:pointer; z-index:7500; color: #fff; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;" title="Close Poster">✕</span>
    <img class="modal-content" id="modalImg" referrerpolicy="no-referrer" onclick="event.stopPropagation()">
</div>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Slide-in Navigation Sidebar -->
<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-title"><i class="fa-solid fa-music" style="color: #ff3b30;"></i> Music Menu</div>
        <button class="closeSide" onclick="toggleSidebar()" aria-label="Close Menu">✕</button>
    </div>
    <div id="sidebarMenuItems" class="sidebar-menu-items">
        <a href="index.html"><i class="fa-solid fa-house"></i> <span>🏠 Home Back</span></a>
        <a href="javascript:void(0)" onclick="showAllSongs()"><i class="fa-solid fa-music"></i> <span>All Songs</span></a>
    </div>
</div>

<!-- Header with Menu & Search -->
<div class="header">
    <button class="menuBtn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i> Menu</button>
    <input type="text" id="musicSearch" placeholder="Search songs, artists, movies..." onkeyup="filterMusicList()">
</div>

<!-- Music Songs List -->
<div id="musicList">
    <div style="text-align: center; color: #888; padding: 40px 10px;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 26px; color: #ff3b30; margin-bottom: 12px;"></i>
        <div>Loading Music Playlist...</div>
    </div>
</div>

<!-- Floating Mini Player -->
<div class="mini-player" id="miniPlayer">
    <div class="controls">
        <span onclick="prevSong()" style="cursor: pointer;" title="Previous Song">
            <img src="preview.png" onerror="this.src='pre.png'; this.onerror=function(){this.src='https://raw.githubusercontent.com/shortsproeran-creator/mt/main/1784459478765_pre.png';}" width="42" height="42" alt="Previous">
        </span>

        <span id="playPauseBtn" onclick="togglePlay()" style="cursor: pointer;" title="Play/Pause">
            <img id="playPauseImg" src="play.png" onerror="this.onerror=function(){this.src='https://raw.githubusercontent.com/shortsproeran-creator/mt/main/1784458824699_play.png';}" width="46" height="46" alt="Play">
        </span>

        <span onclick="nextSong()" style="cursor: pointer;" title="Next Song">
            <img src="next.png" onerror="this.onerror=function(){this.src='https://raw.githubusercontent.com/shortsproeran-creator/mt/main/1784459478765_pre.png'; this.style.transform='scaleX(-1)';}" width="42" height="42" alt="Next">
        </span>
    </div>

    <div class="progress-box">
        <span id="currentTime">0:00</span>
        <input type="range" class="progress-bar" id="audioRange" value="0" min="0" max="100">
        <span id="durationTime">0:00</span>
    </div>

    <div id="nowPlaying" style="text-align:center; font-weight:bold; font-size: 14px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ffffff;">Not Playing</div>

    <audio id="audioPlayer" preload="auto"></audio>
</div>



<script>
// ==========================================
// VIP SUBSCRIPTION ENGINE (100% AD-FREE MUSIC)
// ==========================================
function isVipSubscribed() {
    if (window.__vipSubscriptionExpireAt && Date.now() >= Number(window.__vipSubscriptionExpireAt)) {
        window.__isVipSubscribed = false;
        window.__vipSubscriptionExpireAt = 0;
        try {
            localStorage.removeItem('vdosky_is_vip');
            localStorage.removeItem('vdosky_subscription_cache');
        } catch(e) {}
        return false;
    }
    if (window.__isVipSubscribed === true) return true;
    try {
        if (typeof localStorage !== 'undefined') {
            const cacheRaw = localStorage.getItem('vdosky_subscription_cache');
            if (cacheRaw) {
                const parsed = JSON.parse(cacheRaw);
                if (parsed && parsed.expireAt) {
                    if (Date.now() < Number(parsed.expireAt)) {
                        return true;
                    }
                    localStorage.removeItem('vdosky_is_vip');
                    localStorage.removeItem('vdosky_subscription_cache');
                    return false;
                }
            }
            if (localStorage.getItem('vdosky_is_vip') === 'true') {
                return true;
            }
        }
    } catch(e) {}
    return false;
}
window.isVipSubscribed = isVipSubscribed;

function updateVipAdSuppression() {
    const isVip = isVipSubscribed();
    if (isVip) {
        if (document.body) document.body.classList.add('vip-active');
        if (document.documentElement) document.documentElement.classList.add('vip-active');
    } else {
        if (document.body) document.body.classList.remove('vip-active');
        if (document.documentElement) document.documentElement.classList.remove('vip-active');
    }
    const miniPlayer = document.getElementById('miniPlayer');
    if (miniPlayer) {
        miniPlayer.style.bottom = '0px';
    }
    const musicList = document.getElementById('musicList');
    if (musicList) {
        musicList.style.marginBottom = '145px';
        musicList.style.marginTop = '74px';
    }
}
window.updateVipAdSuppression = updateVipAdSuppression;

window.handleMusicSubscriptionUpdate = function(isSub, expireAtMs) {
    const prev = !!window.__isVipSubscribed;
    window.__isVipSubscribed = !!isSub;
    window.__vipSubscriptionExpireAt = isSub ? Number(expireAtMs || 0) : 0;

    try {
        if (isSub) {
            localStorage.setItem('vdosky_is_vip', 'true');
            if (expireAtMs) {
                localStorage.setItem('vdosky_subscription_cache', JSON.stringify({
                    isSubscribed: true,
                    expireAt: Number(expireAtMs)
                }));
            }
        } else {
            localStorage.removeItem('vdosky_is_vip');
            localStorage.removeItem('vdosky_subscription_cache');
        }
    } catch(e) {}

    updateVipAdSuppression();

    if (prev && !isSub) {
        try {
            const audioEl = document.getElementById('audioPlayer');
            if (audioEl && !audioEl.paused) {
                audioEl.pause();
                if (typeof setPlayPauseIcon === 'function') setPlayPauseIcon(false);
            }
        } catch(e) {}
        if (typeof window.openSubscriptionModal === 'function') {
            window.openSubscriptionModal();
        }
    }
};

updateVipAdSuppression();
window.addEventListener('DOMContentLoaded', updateVipAdSuppression);

window.openInChrome = function(url) {
    if (!url) return;
    if (window.Android && typeof window.Android.openChromeDirectly === 'function') {
        try { window.Android.openChromeDirectly(url); return; } catch (e) {}
    }
    if (window.Android && typeof window.Android.openExternalUrl === 'function') {
        try { window.Android.openExternalUrl(url); return; } catch (e) {}
    }
    window.open(url, '_blank');
};

// ==========================================
// MUSIC PLAYER ENGINE
// ==========================================
let songsList = [], currentQueue = [], currentPlaylist = [], currentSongIndex = 0;
const audio = document.getElementById('audioPlayer');
const range = document.getElementById('audioRange');
const curTimeSpan = document.getElementById('currentTime');
const durTimeSpan = document.getElementById('durationTime');
const playPauseImg = document.getElementById('playPauseImg');

const ICON_PLAY = "play.png";
const ICON_PAUSE = "pause.png";
const FALLBACK_PLAY = "https://raw.githubusercontent.com/shortsproeran-creator/mt/main/1784458824699_play.png";
const FALLBACK_PAUSE = "https://raw.githubusercontent.com/shortsproeran-creator/mt/main/1784459617609_pouse.png";

function setPlayPauseIcon(isPlaying) {
    if (!playPauseImg) return;
    if (isPlaying) {
        playPauseImg.src = ICON_PAUSE;
        playPauseImg.onerror = function() {
            this.src = "pouse.png";
            this.onerror = function() { this.src = FALLBACK_PAUSE; };
        };
    } else {
        playPauseImg.src = ICON_PLAY;
        playPauseImg.onerror = function() {
            this.src = FALLBACK_PLAY;
        };
    }
}

function shuffleArray(array) { return [...array].sort(() => Math.random() - 0.5); }
function formatTime(s) { 
    if (isNaN(s) || s < 0) return "0:00";
    let m = Math.floor(s / 60), sec = Math.floor(s % 60); 
    return m + ":" + (sec < 10 ? "0" + sec : sec); 
}

async function loadMusic() {
    try {
        const res = await fetch("https://raw.githubusercontent.com/appcreator05/post/main/6766846.json");
        songsList = await res.json();
        currentQueue = [];
        songsList.forEach(m => {
            if (Array.isArray(m.songs)) {
                m.songs.forEach(s => currentQueue.push({ ...s, poster: m.poster, movie: m.movie, category: m.category }));
            }
        });
        currentPlaylist = shuffleArray(currentQueue);
        
        renderMusicList(currentPlaylist.slice(0, 100));
        loadCategories();

        // Do NOT autoplay songs when opening music section
        if (currentPlaylist.length > 0) {
            currentSongIndex = 0;
            const song = currentPlaylist[0];
            const nowPlayingEl = document.getElementById('nowPlaying');
            if (nowPlayingEl) {
                nowPlayingEl.innerText = song.title + (song.movie ? ` • ${song.movie}` : '');
            }
            setPlayPauseIcon(false);
        }
    } catch (err) {
        console.error("Failed to load songs:", err);
        const list = document.getElementById('musicList');
        if (list) {
            list.innerHTML = `<div style="text-align:center; padding:40px; color:#ff3b30;">Failed to load music playlist. Please check internet connection.</div>`;
        }
    }
}

let pendingMusicPlayIndex = null;

function openSubscriptionModal() {
    let modal = document.getElementById('vipSubscriptionModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'vipSubscriptionModal';
        modal.className = 'sub-alert-overlay';
        modal.onclick = () => closeSubscriptionModal();
        modal.innerHTML = `
            <div class="sub-alert-card" onclick="event.stopPropagation()">
                <div class="sub-alert-icon-box">
                    <span>?</span>
                </div>
                <h3 class="sub-alert-title">Subscription Alert!</h3>
                <p class="sub-alert-desc">Please subscribe a plan to view our paid items</p>
                <div class="sub-alert-btn-group">
                    <button type="button" class="sub-alert-btn-cancel" onclick="closeSubscriptionModal()">Cancel</button>
                    <button type="button" class="sub-alert-btn-subscribe" onclick="goToSubscriptionSection()">Subscribe Now</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    }
    modal.style.display = 'flex';
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
}

function closeSubscriptionModal() {
    const modal = document.getElementById('vipSubscriptionModal');
    if (modal) {
        modal.classList.remove('show');
        modal.style.display = 'none';
        document.body.style.overflow = '';
    }
}

window.openSubscriptionModal = openSubscriptionModal;
window.closeSubscriptionModal = closeSubscriptionModal;

window.goToSubscriptionSection = function() {
    sessionStorage.setItem('vdosky_open_vip', '1');
    window.location.href = 'index.html';
};

window.payAndActivate = function(price, days, planName, buttonEl) {
    try {
        var targetUA = "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36";
        Object.defineProperty(navigator, 'userAgent', { get: function() { return targetUA; }, configurable: true });
        Object.defineProperty(navigator, 'appVersion', { get: function() { return "5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36"; }, configurable: true });
    } catch(e) {}
    if (typeof Razorpay === 'undefined') {
        alert("Payment gateway loading... please retry in a moment.");
        return;
    }
    const origText = buttonEl ? buttonEl.innerText : 'SELECT PLAN';
    if (buttonEl) {
        buttonEl.disabled = true;
        buttonEl.innerText = 'Processing...';
    }

    const options = {
        key: "rzp_live_T2PygvcB7moN7R",
        amount: Math.round(price * 100),
        currency: "INR",
        name: "VDOSky.in",
        description: planName + " (" + days + " Days)",
        image: "/logo.png",
        handler: function(response) {
            const expireAt = Date.now() + (Number(days || 30) * 86400000);
            if (typeof window.handleMusicSubscriptionUpdate === 'function') {
                window.handleMusicSubscriptionUpdate(true, expireAt);
            }
            if (typeof window.saveMusicSubscriptionToFirebase === 'function') {
                window.saveMusicSubscriptionToFirebase(days, planName, price, response && response.razorpay_payment_id);
            }
            renderMusicList(currentPlaylist);

            const alertEl = document.getElementById('customAlert');
            if (alertEl) {
                alertEl.classList.add('show');
                setTimeout(() => {
                    alertEl.classList.remove('show');
                }, 2000);
            }
            closeSubscriptionModal();
            if (buttonEl) {
                buttonEl.disabled = false;
                buttonEl.innerText = origText;
            }
            // Auto play the pending song on successful activation
            const target = pendingMusicPlayIndex !== null ? pendingMusicPlayIndex : currentSongIndex;
            setTimeout(() => {
                playMusic(target);
            }, 300);
        },
        modal: {
            ondismiss: function() {
                if (buttonEl) {
                    buttonEl.disabled = false;
                    buttonEl.innerText = origText;
                }
            }
        },
        theme: {
            color: "#e50914"
        }
    };

    const rzp = new Razorpay(options);
    rzp.open();
};

function renderMusicList(songs) {
    const list = document.getElementById('musicList');
    if (!list) return;
    const fragment = document.createDocumentFragment();
    list.innerHTML = "";

    const displayLimit = songs.slice(0, 200); 

    displayLimit.forEach((song, i) => {
        const isPlaying = (song.id === (currentPlaylist[currentSongIndex] ? currentPlaylist[currentSongIndex].id : null));
        const div = document.createElement('div');
        div.className = 'song-item' + (isPlaying ? ' active' : '');
        
        div.innerHTML = `<img src="${song.poster || ''}" referrerpolicy="no-referrer" loading="lazy" class="song-img" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&auto=format&fit=crop&q=60';" onclick="openModal('${song.poster}', event)">
                         <div class="song-text-container" onclick="playMusic(${i})">
                             <strong>${song.title}</strong>
                             <small>${song.movie || ''}</small>
                         </div>`;
        fragment.appendChild(div);
    });

    list.appendChild(fragment);
}

function openModal(imgSrc, event) { 
    if (event) event.stopPropagation(); 
    document.getElementById('modalImg').src = imgSrc; 
    document.getElementById('imageModal').style.display = 'flex'; 
    const miniPlayer = document.getElementById('miniPlayer');
    if (miniPlayer && currentPlaylist && currentPlaylist.length > 0) {
        miniPlayer.style.display = 'flex';
        miniPlayer.style.bottom = '0px';
    }
}

function closeModal() { 
    document.getElementById('imageModal').style.display = 'none'; 
}

function playMusic(index, isInitial = false) {
    if (!currentPlaylist || index >= currentPlaylist.length) return;

    // Gate: Check VIP Subscription before playback
    if (!isVipSubscribed()) {
        pendingMusicPlayIndex = index;
        openSubscriptionModal();
        return;
    }

    const song = currentPlaylist[index]; 
    currentSongIndex = index;

    audio.src = `https://www.googleapis.com/drive/v3/files/${song.id}?alt=media&key=AIzaSyAwS9f57z785lDD9aKedEEJVol_-P518v0`;
    document.getElementById('nowPlaying').innerText = song.title + (song.movie ? ` • ${song.movie}` : '');
    
    const miniPlayer = document.getElementById('miniPlayer');
    if (miniPlayer) {
        miniPlayer.style.display = 'flex';
        miniPlayer.style.bottom = '0px';
    }
    
    if (document.getElementById('imageModal').style.display === 'flex') {
        document.getElementById('modalImg').src = song.poster;
    }
    
    const playPromise = audio.play(); 
    if (playPromise !== undefined) {
        playPromise.then(() => {
            setPlayPauseIcon(true);
        }).catch(err => {
            setPlayPauseIcon(false);
        });
    }

    renderMusicList(currentPlaylist);
    
    setTimeout(() => {
        const activeElement = document.querySelector('.song-item.active');
        if (activeElement) activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 120);
}

function nextSong() { 
    if (currentPlaylist.length === 0) return;
    if (!isVipSubscribed()) {
        openSubscriptionModal();
        return;
    }
    currentSongIndex = (currentSongIndex + 1) % currentPlaylist.length; 
    playMusic(currentSongIndex); 
}

function prevSong() { 
    if (currentPlaylist.length === 0) return;
    if (!isVipSubscribed()) {
        openSubscriptionModal();
        return;
    }
    currentSongIndex = (currentSongIndex - 1 + currentPlaylist.length) % currentPlaylist.length; 
    playMusic(currentSongIndex); 
}

function togglePlay() {
    if (!isVipSubscribed()) {
        pendingMusicPlayIndex = currentSongIndex;
        openSubscriptionModal();
        return;
    }
    if (!audio.src && currentPlaylist.length > 0) {
        playMusic(currentSongIndex);
        return;
    }
    if (audio.paused) {
        audio.play().then(() => {
            setPlayPauseIcon(true); 
        }).catch(() => {});
    } else {
        audio.pause();
        setPlayPauseIcon(false);
    }
}

audio.addEventListener('timeupdate', () => {
    if (!isNaN(audio.duration) && audio.duration > 0) {
        range.value = (audio.currentTime / audio.duration) * 100;
        curTimeSpan.innerText = formatTime(audio.currentTime);
        durTimeSpan.innerText = formatTime(audio.duration);
    }
});

audio.addEventListener('loadedmetadata', () => {
    durTimeSpan.innerText = formatTime(audio.duration);
});

range.addEventListener('input', () => {
    if (!isNaN(audio.duration)) {
        audio.currentTime = (range.value / 100) * audio.duration;
    }
});

audio.addEventListener('ended', nextSong);

function toggleSidebar() { 
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    if (!sidebar) return;
    if (sidebar.classList.contains("open")) {
        sidebar.classList.remove("open");
        if (overlay) overlay.style.display = "none";
        document.body.style.overflow = "";
    } else {
        sidebar.classList.add("open");
        if (overlay) overlay.style.display = "block";
        document.body.style.overflow = "hidden";
    }
}

function loadCategories() { 
    const menuContainer = document.getElementById("sidebarMenuItems") || document.getElementById("sidebar");
    if (!menuContainer) return;
    menuContainer.querySelectorAll('a[data-dynamic-cat="1"]').forEach(el => el.remove());
    [...new Set(songsList.map(item => item.category))].filter(Boolean).forEach(cat => { 
        const a = document.createElement("a"); 
        a.href = "javascript:void(0)"; 
        a.setAttribute("data-dynamic-cat", "1");
        a.innerHTML = `<i class="fa-solid fa-compact-disc" style="color: #ff3b30;"></i> <span>${cat}</span>`; 
        
        a.onclick = (e) => { 
            e.preventDefault(); 
            e.stopPropagation(); 
            filterByCategory(cat);
            toggleSidebar();
        }; 
        menuContainer.appendChild(a); 
    }); 
}

function filterByCategory(cat) { 
    audio.pause(); 
    audio.currentTime = 0;
    setPlayPauseIcon(false);
    document.getElementById('nowPlaying').innerText = "Select a song (" + cat + ")";
    
    const filteredSongs = shuffleArray(currentQueue.filter(s => s.category === cat));
    currentPlaylist = filteredSongs;
    currentSongIndex = 0; 
    
    renderMusicList(currentPlaylist); 
}

let searchTimeout;
function filterMusicList() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        let val = document.getElementById('musicSearch').value.toLowerCase().trim();
        if (!val) {
            currentPlaylist = currentQueue;
        } else {
            let filtered = currentQueue.filter(s => 
                (s.title && s.title.toLowerCase().includes(val)) || 
                (s.movie && s.movie.toLowerCase().includes(val)) ||
                (s.category && s.category.toLowerCase().includes(val))
            );
            currentPlaylist = filtered; 
        }
        renderMusicList(currentPlaylist); 
    }, 300);
}

function stopMusic() {
    audio.pause(); 
    audio.currentTime = 0;
    setPlayPauseIcon(false);
    document.getElementById('miniPlayer').style.display = 'none';
}
  
function showAllSongs() { 
    currentPlaylist = shuffleArray(currentQueue); 
    renderMusicList(currentPlaylist); 
    toggleSidebar(); 
}

loadMusic();
</script>

<!-- Subscription Alert Modal Popup matching sub.jpg -->
<div id="vipSubscriptionModal" class="sub-alert-overlay" onclick="window.closeSubscriptionModal()">
    <div class="sub-alert-card" onclick="event.stopPropagation()">
        <!-- Pink/Red Rounded Square with Question Mark Icon -->
        <div class="sub-alert-icon-box">
            <span>?</span>
        </div>

        <h3 class="sub-alert-title">Subscription Alert!</h3>
        <p class="sub-alert-desc">Please subscribe a plan to view our paid items</p>

        <div class="sub-alert-btn-group">
            <button type="button" class="sub-alert-btn-cancel" onclick="window.closeSubscriptionModal()">Cancel</button>
            <button type="button" class="sub-alert-btn-subscribe" onclick="window.goToSubscriptionSection()">Subscribe Now</button>
        </div>
    </div>
</div>

<!-- Custom Alert Popup UI (Success Notification) -->
<div id="customAlert" class="custom-alert-overlay">
  <div class="custom-alert-box">
    <div class="icon">✓</div>
    <h3>Subscription Activated!</h3>
    <p>VIP Active! Enjoy Unlimited Songs & Ad-Free Streaming.</p>
  </div>
</div>

</body>
</html>
